apiVersion: v1
kind: ServiceAccount
metadata:
  name: segment-controller
  namespace: rig
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: segment-controller
rules:
  - apiGroups: ["bounded-autonomy.io"]
    resources: ["taskdeclarations", "taskdeclarations/status"]
    verbs: ["*"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: segment-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: segment-controller
subjects:
  - kind: ServiceAccount
    name: segment-controller
    namespace: rig
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: segment-controller
  namespace: rig
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: segment-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: segment-controller
    spec:
      serviceAccountName: segment-controller
      containers:
        - name: controller
          image: ba-runtime:paper1
          args: ["kopf", "run", "--standalone", "/app/rig/controller/handler.py"]
          env:
            - name: PYTHONPATH
              value: /app:/app/rig
            - name: BA_SKIP_SPIRE
              value: "0"
