apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: rig
type: Opaque
stringData:
  POSTGRES_PASSWORD: rig
  POSTGRES_USER: rig
  POSTGRES_DB: rig
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: rig
data:
  00-init.sql: |
    CREATE TABLE IF NOT EXISTS records (
        key TEXT PRIMARY KEY,
        value JSONB NOT NULL,
        task_id TEXT,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS records_history (
        id BIGSERIAL PRIMARY KEY,
        key TEXT NOT NULL,
        before JSONB,
        after JSONB,
        op TEXT NOT NULL,
        task_id TEXT,
        at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: rig
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: bounded-autonomy-stores
    spec:
      containers:
        - name: postgres
          image: postgres:17.5
          args:
            - postgres
            - -c
            - wal_level=logical
            - -c
            - max_replication_slots=8
            - -c
            - max_wal_senders=8
          envFrom:
            - secretRef:
                name: postgres
          ports:
            - containerPort: 5432
              name: pg
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rig
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      name: pg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: rig
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: bounded-autonomy-stores
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: rig
            - name: MINIO_ROOT_PASSWORD
              value: rig-secret
            - name: MINIO_NOTIFY_WEBHOOK_ENABLE_gt
              value: "on"
            - name: MINIO_NOTIFY_WEBHOOK_ENDPOINT_gt
              value: http://groundtruth:8090/minio
          ports:
            - containerPort: 9000
              name: s3
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: rig
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - port: 9000
      name: s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: rig
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/part-of: bounded-autonomy-stores
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.13.6
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: rig
spec:
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - port: 6333
      name: http
    - port: 6334
      name: grpc
