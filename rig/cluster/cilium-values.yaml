# Cilium 1.17.13 on a one-node k3d cluster. Pins live in rig/versions.yaml.
# No bundled SPIRE / Cilium mutual auth — Paper 1 selects on the task-id label.
# k3s 1.32 kubelet loads CNI from /opt/cni/bin (default). Do not set binPath
# to /bin: that is where k3s keeps its own plugins, and CoreDNS then stays
# ContainerCreating with "failed to find plugin cilium-cni in /opt/cni/bin".
kubeProxyReplacement: true
k8sServiceHost: k3d-bounded-autonomy-server-0
k8sServicePort: 6443
operator:
  replicas: 1
ipam:
  mode: kubernetes
socketLB:
  # Docker Desktop / k3d: cgroup v2 nesting does not attach socket-LB to
  # pod cgroups, so ClusterIP (kubernetes 10.43.0.1) blackholes and CoreDNS
  # stays unready. Host-namespace-only uses the TC datapath for pods.
  hostNamespaceOnly: true
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: false
