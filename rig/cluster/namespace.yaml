apiVersion: v1
kind: Namespace
metadata:
  name: rig
  labels:
    bounded-autonomy.io/part-of: paper1
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: rig
spec:
  description: default-deny agent datapath; segments add allow-lists
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agent
  enableDefaultDeny:
    ingress: true
    egress: true
