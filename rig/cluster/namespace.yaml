apiVersion: v1
kind: Namespace
metadata:
  name: rig
  labels:
    bounded-autonomy.io/part-of: paper1
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: rig
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: rig
spec:
  description: >-
    idle agent default-deny; no unrestricted DNS. Task CNP is the only
    DNS allow-list (CoreDNS, declared names only). See findings/23-evasion.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agent
  enableDefaultDeny:
    egress: true
  egress: []
