apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: bounded-autonomy
servers: 1
agents: 0
image: rancher/k3s:v1.32.3-k3s1
volumes:
  # Host bpffs/cgroup. On Darwin, cluster_up.sh strips these and mounts
  # inside the node instead (macOS has no /sys/fs/bpf).
  - volume: /sys/fs/bpf:/sys/fs/bpf
    nodeFilters: [all]
  - volume: /sys/fs/cgroup:/sys/fs/cgroup
    nodeFilters: [all]
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters: [server:*]
      - arg: --disable-network-policy
        nodeFilters: [server:*]
      - arg: --flannel-backend=none
        nodeFilters: [server:*]
      - arg: --disable-kube-proxy
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
