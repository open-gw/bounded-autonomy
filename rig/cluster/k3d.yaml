apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: bounded-autonomy
servers: 1
agents: 0
image: rancher/k3s:v1.32.3-k3s1
volumes:
  # Specced host binds. cluster_up.sh rewrites this file before k3d create:
  # Darwin drops both (no host bpffs). Linux drops cgroup (cgroup v2
  # nsdelegate + cgroupns=private breaks kubelet) and keeps bpf.
  - volume: /sys/fs/bpf:/sys/fs/bpf
    nodeFilters: [all]
  - volume: /sys/fs/cgroup:/sys/fs/cgroup
    nodeFilters: [all]
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters: [server:*]
      - arg: --disable-network-policy
        nodeFilters: [server:*]
      - arg: --flannel-backend=none
        nodeFilters: [server:*]
      - arg: --disable-kube-proxy
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
