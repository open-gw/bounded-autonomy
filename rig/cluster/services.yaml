# Eight services. Sensitivity is an annotation, not a network selector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: records
  namespace: rig
  labels:
    app.kubernetes.io/name: records
    app.kubernetes.io/part-of: bounded-autonomy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: records
  template:
    metadata:
      labels:
        app.kubernetes.io/name: records
        app.kubernetes.io/part-of: bounded-autonomy
      annotations:
        bounded-autonomy.io/sensitivity: "3"
    spec:
      containers:
        - name: tool
          image: ba-runtime:paper1
          args: ["python", "-m", "tools.http_server", "--name", "records", "--port", "8081"]
          env:
            - name: TOOL_NAME
              value: records
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: STORE_DSN
              value: postgresql://rig:rig@postgres:5432/rig
          ports:
            - name: http
              containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: records
  namespace: rig
  labels:
    app.kubernetes.io/name: records
    app.kubernetes.io/part-of: bounded-autonomy
spec:
  selector:
    app.kubernetes.io/name: records
  ports:
    - name: http
      port: 8081
      targetPort: http
---
