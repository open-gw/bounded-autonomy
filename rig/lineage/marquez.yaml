apiVersion: apps/v1
kind: Deployment
metadata:
  name: marquez
  namespace: rig
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marquez
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marquez
        # Outside every task segment: no bounded-autonomy.io/part-of workload label.
    spec:
      containers:
        - name: marquez
          image: marquezproject/marquez:0.50.1
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: rig
            - name: POSTGRES_USER
              value: rig
            - name: POSTGRES_PASSWORD
              value: rig
            - name: MARQUEZ_PORT
              value: "5000"
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: marquez
  namespace: rig
spec:
  selector:
    app.kubernetes.io/name: marquez
  ports:
    - port: 5000
      name: http
