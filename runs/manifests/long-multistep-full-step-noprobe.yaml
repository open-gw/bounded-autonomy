apiVersion: bounded-autonomy.io/v1
kind: RunManifest
metadata:
  run_id: long-multistep-full-step-noprobe-seed1
  created: "2026-09-28T00:00:00Z"
spec:
  profile: long-multistep
  mode: full
  seed: 1
  steps: 30
  expected_duration_seconds: 1800
  expected_step_duration_seconds: 60
